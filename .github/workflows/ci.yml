name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install development dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Run Tests
        run: |
          pytest backend/tests
  
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      - name: Run Tests
        run: |
          cd frontend
          npm test

  # Builds both images and then runs the stack, because building is the part
  # that has never been what breaks: the images that shipped a Python too old
  # for the app's annotations, an OpenCV with no libGL, and a caption font
  # resolving to a monospace face all built without complaint.
  test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Match the container user to the checkout
        # The backend bind-mounts ./projects and ./backend/config and writes to
        # both. The image defaults to uid 1000; the runner's checkout is owned
        # by uid 1001, so without this the writes are denied.
        run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build and smoke-test the stack
        env:
          # Safe here and only here: the named volumes hold a YouTube token and
          # cached model weights on a real machine, so the script keeps them by
          # default.
          DOWN_VOLUMES: 1
        run: ./docker/smoke-test.sh

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 300
