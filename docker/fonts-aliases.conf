<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- The shipped caption styles name Arial and Arial Black. Neither is
       redistributable, so the image carries the metric-compatible Liberation
       family instead. Debian already aliases Arial to Liberation Sans; without
       the rule below "Arial Black" matches nothing and fontconfig hands back
       whatever sorts first, which is Liberation Mono - a monospace face for a
       caption headline. Mapping it to Liberation Sans at bold weight is the
       closest free stand-in.

       The browser preview still draws with the real Arial Black when the
       viewer's machine has it, so preview and burn differ slightly in weight.
       Installing the genuine fonts into the image is the only way to make them
       identical. -->
  <match target="pattern">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Arial Black</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Liberation Sans</string>
    </edit>
    <edit name="weight" mode="assign" binding="strong">
      <const>bold</const>
    </edit>
  </match>
</fontconfig>
