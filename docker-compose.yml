version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: open-clip-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./projects:/app/projects
    environment:
      - ENV=production
    networks:
      - app-network
    command: ["python", "-m", "backend.api"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: open-clip-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge
